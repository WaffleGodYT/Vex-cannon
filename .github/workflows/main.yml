name: Build VexCannon
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package -f "$(find . -name pom.xml -not -path '*/target/*' | head -n1)"
      - uses: actions/upload-artifact@v4
        with:
          name: VexCannon-jar
          path: '**/target/VexCannon.jar'
