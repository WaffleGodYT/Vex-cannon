name: VexCannon
version: 1.0.0
main: com.wafflegod.vexcannon.VexCannonPlugin
api-version: '1.21'
description: Craftable Vex Cannon (crossbow) that summons vexes to attack another player.
commands:
  vexcannon:
    description: Give yourself the Vex Cannon or check its recipe.
    usage: /vexcannon give [player] | /vexcannon recipe
    aliases: [vcannon]
    permission: vexcannon.admin
permissions:
  vexcannon.admin:
    description: Allows /vexcannon give and /vexcannon recipe
    default: op
  vexcannon.use:
    description: Allows using the Vex Cannon
    default: true
